name: Auto-Check Brave Stable Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Neueste Brave stable Version mit APK holen
        id: get_brave
        run: |
          VERSION=$(python3 << 'EOF'
          import json, subprocess, sys

          found = None
          for page in range(1, 11):
            result = subprocess.run(
              ['curl', '-sf',
               '-H', 'Cache-Control: no-cache',
               '-H', 'Authorization: token ',
               f'https://api.github.com/repos/brave/brave-browser/releases?per_page=100&page={page}'],
              capture_output=True, text=True
            )
            releases = json.loads(result.stdout)
            if not releases:
              print(f'Seite {page} leer, stoppe.', file=sys.stderr)
              break
            print(f'Seite {page}: {len(releases)} Releases', file=sys.stderr)
            for r in releases:
              name = r.get('name', '').lower()
              tag = r['tag_name']
              if 'nightly' in name or 'beta' in name or 'alpha' in name:
                continue
              print(f'Kandidat: {tag} ({r.get("name","")[:50]})', file=sys.stderr)
              url = f'https://github.com/brave/brave-browser/releases/download/{tag}/Bravearm64Universal.apk'
              check = subprocess.run(
                ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}', '-L', '--max-time', '15', '-I', url],
                capture_output=True, text=True
              )
              code = check.stdout.strip()
              print(f'  APK check {tag}: {code}', file=sys.stderr)
              if code == '200':
                found = tag
                break
            if found:
              break

          if found:
            print(found)
          else:
            print('NICHT GEFUNDEN', file=sys.stderr)
            sys.exit(1)
          EOF
          )
          if [ -z "$VERSION" ]; then
            echo "⚠️ Keine stable Version mit APK gefunden — abbruch."
            exit 1
          fi
          echo "brave_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Neueste Brave stable mit APK: $VERSION"

      - name: Letzten eigenen Release holen
        id: get_own
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "last_release=$LAST" >> $GITHUB_OUTPUT
          echo "Letzter eigener Release: $LAST"

      - name: Vergleichen
        id: check
        run: |
          BRAVE="${{ steps.get_brave.outputs.brave_version }}"
          LAST="${{ steps.get_own.outputs.last_release }}"

          BRAVE_CLEAN="${BRAVE#v}"
          LAST_CLEAN="${LAST#v}"
          LAST_CLEAN="${LAST_CLEAN#v}"

          echo "Brave (clean): $BRAVE_CLEAN"
          echo "Letzter Build (clean): $LAST_CLEAN"

          if [ -z "$LAST_CLEAN" ]; then
            echo "🆕 Kein eigener Release gefunden — starte Build für $BRAVE"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$BRAVE_CLEAN" = "$LAST_CLEAN" ]; then
            echo "✅ Bereits gebaut: $BRAVE — nichts zu tun."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 Neue Version: $BRAVE (letzter Build: $LAST)"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      brave_version: ${{ needs.check.outputs.version }}
      arch: "arm64"
    secrets: inherit
