name: Auto-Check Brave Stable Release

on:
  schedule:
    - cron: '0 8  * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Neueste Brave stable Version mit APK holen
        id: get_brave
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retries cover transient API hiccups (empty/5xx responses).
          curl -sS --fail --retry 4 --retry-all-errors --retry-delay 10 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o releases.json \
            "https://api.github.com/repos/brave/brave-browser/releases?per_page=100"

          # The release list already contains each release's assets, so no
          # per-release HEAD request is needed to check for the APK.
          VERSION=$(python3 - releases.json Bravearm64Universal.apk << 'PY'
          import sys, json
          path, apk = sys.argv[1], sys.argv[2]
          try:
              releases = json.load(open(path))
          except ValueError as e:
              sys.exit(f"GitHub API returned no valid JSON: {e}")
          if not isinstance(releases, list):
              sys.exit(f"Unexpected API response: {str(releases)[:300]}")
          for r in releases:
              name = (r.get('name') or '').lower()
              if r.get('prerelease') or r.get('draft') or 'nightly' in name or 'beta' in name:
                  continue
              if any(a.get('name') == apk and a.get('state') == 'uploaded'
                     for a in r.get('assets', [])):
                  print(r['tag_name'])
                  break
              print(f"Skipping {r['tag_name']}: no {apk}", file=sys.stderr)
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "⚠️ Keine stable Version mit APK gefunden — abbruch."
            exit 1
          fi
          echo "brave_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Neueste Brave stable mit APK: $VERSION"

      - name: Letzten eigenen Release holen
        id: get_own
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "last_release=$LAST" >> $GITHUB_OUTPUT
          echo "Letzter eigener Release: $LAST"

      - name: Vergleichen
        id: check
        run: |
          BRAVE="${{ steps.get_brave.outputs.brave_version }}"
          LAST="${{ steps.get_own.outputs.last_release }}"

          BRAVE_CLEAN="${BRAVE#v}"
          LAST_CLEAN="${LAST#v}"
          LAST_CLEAN="${LAST_CLEAN#v}"

          echo "Brave (clean): $BRAVE_CLEAN"
          echo "Letzter Build (clean): $LAST_CLEAN"

          if [ -z "$LAST_CLEAN" ]; then
            echo "🆕 Kein eigener Release gefunden — starte Build für $BRAVE"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRAVE_LATEST=$(printf '%s\n' "$BRAVE_CLEAN" "$LAST_CLEAN" | sort -V | tail -1)

          if [ "$BRAVE_CLEAN" = "$LAST_CLEAN" ]; then
            echo "✅ Bereits gebaut: $BRAVE — nichts zu tun."
            echo "should_build=false" >> $GITHUB_OUTPUT
          elif [ "$BRAVE_LATEST" = "$LAST_CLEAN" ]; then
            echo "✅ Eigener Build ($LAST_CLEAN) ist neuer als gefundene Version ($BRAVE_CLEAN) — nichts zu tun."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 Neue Version: $BRAVE (letzter Build: $LAST)"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      brave_version: ${{ needs.check.outputs.version }}
      arch: "arm64"
    secrets: inherit
