```yaml
name: Auto-Check Brave Stable Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Neueste Brave stable Version holen
        id: get_brave
        run: |
          VERSION=$(curl -sf "https://api.github.com/repos/brave/brave-browser/releases?per_page=100" \
            | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          stable = next(
            r['tag_name'] for r in releases
            if not r.get('prerelease')
            and not r.get('draft')
            and 'nightly' not in r.get('name', '').lower()
            and 'beta' not in r.get('name', '').lower()
          )
          print(stable)
          ")
          echo "brave_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Neueste Brave stable: $VERSION"

      - name: Prüfen ob APK verfügbar ist
        id: apk_check
        run: |
          VERSION="${{ steps.get_brave.outputs.brave_version }}"
          APK_URL="https://github.com/brave/brave-browser/releases/download/${VERSION}/Bravearm64Universal.apk"
          echo "Prüfe: $APK_URL"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 "$APK_URL")
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ APK verfügbar"
            echo "apk_available=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ APK noch nicht verfügbar ($HTTP_CODE) — überspringe Build"
            echo "apk_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Letzten eigenen Release holen
        id: get_own
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "last_release=$LAST" >> $GITHUB_OUTPUT
          echo "Letzter eigener Release: $LAST"

      - name: Vergleichen
        id: check
        run: |
          if [ "${{ steps.apk_check.outputs.apk_available }}" = "false" ]; then
            echo "⏭️ Kein APK verfügbar — Build wird nicht gestartet."
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRAVE="${{ steps.get_brave.outputs.brave_version }}"
          LAST="${{ steps.get_own.outputs.last_release }}"

          BRAVE_CLEAN="${BRAVE#v}"
          LAST_CLEAN="${LAST#v}"
          LAST_CLEAN="${LAST_CLEAN#v}"

          echo "Brave (clean): $BRAVE_CLEAN"
          echo "Letzter Build (clean): $LAST_CLEAN"

          if [ "$BRAVE_CLEAN" = "$LAST_CLEAN" ]; then
            echo "✅ Bereits gebaut: $BRAVE — nichts zu tun."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 Neue Version: $BRAVE (letzter Build: $LAST)"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      brave_version: ${{ needs.check.outputs.version }}
      arch: "arm64"
    secrets: inherit
```
