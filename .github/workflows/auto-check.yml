name: Auto-Check Brave Stable Release

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Neueste Brave stable Version mit APK holen
        id: get_brave
        run: |
          VERSION=$(curl -sf "https://api.github.com/repos/brave/brave-browser/releases?per_page=100" \
            | python3 -c "
          import sys, json, subprocess
          releases = json.load(sys.stdin)
          for r in releases:
            if r.get('prerelease') or r.get('draft'):
              continue
            if 'nightly' in r.get('name', '').lower():
              continue
            if 'beta' in r.get('name', '').lower():
              continue
            tag = r['tag_name']
            url = f'https://github.com/brave/brave-browser/releases/download/{tag}/Bravearm64Universal.apk'
            result = subprocess.run(
              ['curl', '-s', '-o', '/dev/null', '-w', '%{http_code}', '-L', '--max-time', '10', '-I', url],
              capture_output=True, text=True
            )
            if result.stdout.strip() == '200':
              print(tag)
              break
          ")
          if [ -z "$VERSION" ]; then
            echo "⚠️ Keine stable Version mit APK gefunden — abbruch."
            exit 1
          fi
          echo "brave_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Neueste Brave stable mit APK: $VERSION"

      - name: Letzten eigenen Release holen
        id: get_own
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "last_release=$LAST" >> $GITHUB_OUTPUT
          echo "Letzter eigener Release: $LAST"

      - name: Vergleichen
        id: check
        run: |
          BRAVE="${{ steps.get_brave.outputs.brave_version }}"
          LAST="${{ steps.get_own.outputs.last_release }}"

          BRAVE_CLEAN="${BRAVE#v}"
          LAST_CLEAN="${LAST#v}"
          LAST_CLEAN="${LAST_CLEAN#v}"

          echo "Brave (clean): $BRAVE_CLEAN"
          echo "Letzter Build (clean): $LAST_CLEAN"

          if [ -z "$LAST_CLEAN" ]; then
            echo "🆕 Kein eigener Release gefunden — starte Build für $BRAVE"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$BRAVE_CLEAN" = "$LAST_CLEAN" ]; then
            echo "✅ Bereits gebaut: $BRAVE — nichts zu tun."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 Neue Version: $BRAVE (letzter Build: $LAST)"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$BRAVE" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      brave_version: ${{ needs.check.outputs.version }}
      arch: "arm64"
    secrets: inherit
