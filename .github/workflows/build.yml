name: Brave AudioFocus APK Patcher

on:
  workflow_dispatch:
    inputs:
      brave_version:
        description: 'Brave Version z.B. v1.89.135 (leer = neueste stable)'
        required: false
        default: ''
      arch:
        description: 'CPU Architektur'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl python3 openjdk-17-jdk zipalign apksigner

      - name: Get Brave version
        run: |
          if [ -n "${{ github.event.inputs.brave_version }}" ]; then
            VERSION="${{ github.event.inputs.brave_version }}"
          else
            VERSION=$(curl -sf "https://api.github.com/repos/brave/brave-browser/releases" \
              | python3 -c "import sys, json; print([r['tag_name'] for r in json.load(sys.stdin) if not r['prerelease'] and not r['draft']][0])")
          fi
          echo "BRAVE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Download Brave APK
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          APK_NAME="Bravearm64Universal.apk"
          [ "$ARCH" = "arm32" ] && APK_NAME="BraveMonoarm.apk"
          APK_URL="https://github.com/brave/brave-browser/releases/download/${BRAVE_VERSION}/${APK_NAME}"
          curl -L --output brave_original.apk "$APK_URL"

      - name: Patch APK
        run: |
          python3 patches/audiofocus_patch_precise.py brave_original.apk brave_patched.apk

      - name: Zipalign
        run: |
          zipalign -p 4 brave_patched.apk brave_aligned.apk

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out brave_signed.apk \
            brave_aligned.apk

          apksigner verify brave_signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brave-patched
          path: brave_signed.apk
