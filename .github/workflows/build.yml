name: Brave AudioFocus APK Patcher

on:
  workflow_dispatch:
    inputs:
      brave_version:
        description: "Brave Version z.B. v1.91.169 (leer = neueste stable)"
        required: false
        default: ""
      arch:
        description: "CPU Architektur"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm32
  workflow_call:
    inputs:
      brave_version:
        required: false
        type: string
        default: ""
      arch:
        required: false
        type: string
        default: "arm64"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl python3 openjdk-17-jdk zipalign apksigner

      - name: Set Brave version (STABLE ONLY)
        run: |
          if [ -n "${{ inputs.brave_version }}" ]; then
            VERSION="${{ inputs.brave_version }}"
          elif [ -n "${{ github.event.inputs.brave_version }}" ]; then
            VERSION="${{ github.event.inputs.brave_version }}"
          else
            curl -sS --fail --retry 4 --retry-all-errors --retry-delay 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -o releases.json \
              "https://api.github.com/repos/brave/brave-browser/releases?per_page=100"
            VERSION=$(python3 - releases.json Bravearm64Universal.apk << 'PY'
          import sys, json
          path, apk = sys.argv[1], sys.argv[2]
          try:
              releases = json.load(open(path))
          except ValueError as e:
              sys.exit(f"GitHub API returned no valid JSON: {e}")
          if not isinstance(releases, list):
              sys.exit(f"Unexpected API response: {str(releases)[:300]}")
          for r in releases:
              name = (r.get('name') or '').lower()
              if r.get('prerelease') or r.get('draft') or 'nightly' in name or 'beta' in name:
                  continue
              if any(a.get('name') == apk and a.get('state') == 'uploaded'
                     for a in r.get('assets', [])):
                  print(r['tag_name'])
                  break
          PY
            )
          fi
          if [ -z "$VERSION" ]; then
            echo "⚠️ Keine stable Version mit APK gefunden — abbruch."
            exit 1
          fi
          echo "BRAVE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Download Brave APK
        run: |
          ARCH="${{ inputs.arch }}"
          if [ -z "$ARCH" ]; then ARCH="${{ github.event.inputs.arch }}"; fi
          if [ -z "$ARCH" ]; then ARCH="arm64"; fi
          APK_NAME="Bravearm64Universal.apk"
          if [ "$ARCH" = "arm32" ]; then APK_NAME="BraveMonoarm.apk"; fi
          APK_URL="https://github.com/brave/brave-browser/releases/download/${BRAVE_VERSION}/${APK_NAME}"
          echo "Download: $APK_URL"
          curl -L --retry 3 -o brave_original.apk "$APK_URL"

      - name: Patch APK
        run: |
          python3 patches/audiofocus_patch_precise.py --mode duck brave_original.apk brave_patched.apk

      - name: Zipalign APK
        run: |
          zipalign -p 4 brave_patched.apk brave_aligned.apk

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out brave_signed.apk \
            brave_aligned.apk
          apksigner verify brave_signed.apk && echo "✓ SIGNED OK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BRAVE_VERSION }}
          name: Brave Patched ${{ env.BRAVE_VERSION }}
          files: brave_signed.apk
