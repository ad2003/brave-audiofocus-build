name: Brave AudioFocus APK Patcher

on:
  workflow_dispatch:
    inputs:
      brave_version:
        description: "Brave Version (leer = neueste stable)"
        required: false
        default: ""
      arch:
        description: "CPU Architektur"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm32

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl python3 openjdk-17-jdk zipalign apksigner

      # ─────────────────────────────
      # VERSION RESOLVER (SAFE)
      # ─────────────────────────────
      - name: Set Brave version (stable only)
        run: |
          if [ -n "${{ github.event.inputs.brave_version }}" ]; then
            echo "BRAVE_VERSION=${{ github.event.inputs.brave_version }}" >> $GITHUB_ENV
          else
            VERSION=$(curl -s https://api.github.com/repos/brave/brave-browser/releases \
              | python3 -c "
import sys, json

data = json.load(sys.stdin)

for r in data:
    name = r.get('name','').lower()
    tag = r.get('tag_name','').lower()

    if any(x in name for x in ['nightly','beta','dev','canary']):
        continue
    if not r.get('prerelease') and not r.get('draft'):
        print(r['tag_name'])
        break
")
            echo "BRAVE_VERSION=$VERSION" >> $GITHUB_ENV
          fi

          echo "Selected version: $BRAVE_VERSION"

      # ─────────────────────────────
      # DOWNLOAD
      # ─────────────────────────────
      - name: Download Brave APK
        run: |
          ARCH="${{ github.event.inputs.arch }}"

          APK_NAME="Bravearm64Universal.apk"
          if [ "$ARCH" = "arm32" ]; then
            APK_NAME="BraveMonoarm.apk"
          fi

          URL="https://github.com/brave/brave-browser/releases/download/${BRAVE_VERSION}/${APK_NAME}"

          echo "Downloading $URL"
          curl -L -o brave_original.apk "$URL"

      # ─────────────────────────────
      # PATCH
      # ─────────────────────────────
      - name: Patch APK
        run: |
          python3 patches/audiofocus_patch_precise.py brave_original.apk brave_patched.apk

      # ─────────────────────────────
      # ALIGN
      # ─────────────────────────────
      - name: Zipalign
        run: |
          zipalign -p 4 brave_patched.apk brave_aligned.apk

      # ─────────────────────────────
      # SIGN
      # ─────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out brave_signed.apk \
            brave_aligned.apk

          apksigner verify brave_signed.apk

      # ─────────────────────────────
      # RELEASE
      # ─────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BRAVE_VERSION }}
          name: Brave Patched ${{ env.BRAVE_VERSION }}
          files: brave_signed.apk
